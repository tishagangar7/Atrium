[project]
name = "rescuemesh-backend"
version = "0.1.0"
description = "RescueMesh backend: FastAPI integration layer (WS-C)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "anthropic>=1.13.0",
    "openai>=3.28.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
